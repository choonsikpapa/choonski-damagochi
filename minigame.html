<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>춘구마 청기백기</title><style>:root{--ink:#211b17;--paper:#f7f0e4;--panel:#fff9ee;--green:#a8d586;--water:#8ed7ff;--kimchi:#f08a6b}*{box-sizing:border-box}body{margin:0;background:#ddd5c8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:10px}.game{width:min(470px,100%);background:var(--paper);border:5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #bdb3a5}.top{padding:14px 17px 4px;display:flex;justify-content:space-between;font-weight:1000;font-size:18px}.sub{text-align:center;font-size:12px;font-weight:900;padding:0 16px 10px}.screen{margin:0 14px 14px;padding:10px;background:var(--green);border:5px solid var(--ink);border-radius:18px}.stage{height:340px;background:#f7ead4;border:3px solid #4d443b;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage:after{content:'';position:absolute;left:12%;right:12%;bottom:32px;height:5px;background:#8b6a4d;border:2px solid var(--ink);border-radius:5px}.hint{position:absolute;top:16px;font-size:15px;font-weight:1000;background:#fff8e8;border:3px solid var(--ink);border-radius:999px;padding:7px 12px;z-index:3}.score{position:absolute;top:16px;right:12px;background:#fff8e8;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:1000;z-index:3}.chunguma{width:150px;height:190px;background:#c8753d;border:4px solid var(--ink);border-radius:48% 48% 44% 44%/38% 38% 58% 58%;position:relative;z-index:2;box-shadow:inset -10px -7px 0 #a95e34, inset 6px 6px 0 #dc8b52;animation:float 1s steps(2,end) infinite alternate}.chunguma:before,.chunguma:after{content:'';position:absolute;top:64px;width:22px;height:70px;background:#c8753d;border:4px solid var(--ink);border-radius:20px}.chunguma:before{left:-22px;transform:rotate(18deg)}.chunguma:after{right:-22px;transform:rotate(-18deg)}.eye{position:absolute;top:63px;width:13px;height:18px;background:var(--ink);border-radius:50%}.eye.l{left:42px}.eye.r{right:42px}.mouth{position:absolute;left:50%;top:91px;transform:translateX(-50%);width:34px;height:20px;border-bottom:5px solid var(--ink);border-radius:0 0 50% 50%}.cheek{position:absolute;top:91px;width:18px;height:10px;border-radius:50%;background:#e6a06f}.cheek.l{left:20px}.cheek.r{right:20px}.held{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-size:42px;z-index:4;filter:drop-shadow(2px 2px 0 #fff8e8);animation:pop .35s steps(2,end)}.feet{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:28px}.food{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);font-size:24px;z-index:1}.kg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:1000;background:#fff8e8;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;z-index:4}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:4px solid var(--ink);border-radius:16px;padding:15px 8px;font-size:20px;font-weight:1000;cursor:pointer;background:var(--panel);box-shadow:0 5px 0 #bdb3a5}.btn.water{background:var(--water)}.btn.kimchi{background:var(--kimchi)}.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #bdb3a5}.btn:disabled{opacity:.45;cursor:default}.start,.home{width:100%;margin-top:10px;border:3px solid var(--ink);border-radius:13px;background:var(--panel);padding:11px;font-weight:1000;cursor:pointer}.rules{padding:4px 16px 16px;font-size:12px;line-height:1.6;font-weight:800}.over{position:absolute;inset:0;background:rgba(255,248,232,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center}.over h2{margin:0 0 8px;font-size:27px}.over p{margin:4px}.hidden{display:none!important}@keyframes float{to{transform:translateY(-4px)}}@keyframes pop{0%{transform:translateX(-50%) scale(.5)}100%{transform:translateX(-50%) scale(1)}}@media(max-width:380px){.stage{height:300px}.chunguma{width:132px;height:168px}.eye{top:56px}.eye.l{left:35px}.eye.r{right:35px}.mouth{top:81px}.cheek{top:82px}}</style></head><body><main class="game"><div class="top"><div>🍠 춘구마 밥주기</div><div id="fails">실패 0/3</div></div><div class="sub">청기백기처럼 신호를 보고 바로 눌러주세요!</div><div class="screen"><div id="stage" class="stage"><div id="hint" class="hint">게임 시작을 눌러주세요</div><div id="score" class="score">라운드 0 · 정답 0</div><div id="chunguma" class="chunguma"><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="feet">🦶 🦶</div><div id="held" class="held hidden"></div></div><div class="food">🍚</div><div id="kg" class="kg">먹인 밥 0.0 kg</div><div id="over" class="over hidden"><h2>게임 오버!</h2><p id="overText">춘구마에게 0.0kg을 먹였어요.</p><button class="start" onclick="startGame()">다시 하기</button></div></div><div class="buttons"><button id="water" class="btn water" onclick="answer('water')">💧 물</button><button id="kimchi" class="btn kimchi" onclick="answer('kimchi')">🥬 김치</button></div><button id="start" class="start" onclick="startGame()">🍠 춘구마에게 밥 주기 시작!</button></div><div class="rules">정답을 누를 때마다 춘구마가 밥을 먹고 <b>0.1kg</b>씩 증가합니다.<br>틀린 버튼을 누르거나 시간 안에 누르지 못하면 실패입니다.<br><b>3번 실패하면 즉시 게임오버</b>됩니다.</div><button class="home" onclick="location.href='index.html'">🏠 춘식이 키우기로 돌아가기</button></main><script>
const MAX_FAIL=3,MAX_ROUNDS=20;
const $=id=>document.getElementById(id);
const el={stage:$('stage'),hint:$('hint'),score:$('score'),fails:$('fails'),chunguma:$('chunguma'),held:$('held'),kg:$('kg'),over:$('over'),overText:$('overText'),start:$('start'),water:$('water'),kimchi:$('kimchi')};
const gameState={playing:false,round:0,correct:0,fails:0,kg:0,target:'',deadline:0,roundActive:false};
let timer=null,transitionTimer=null;

function setButtons(disabled){el.water.disabled=disabled;el.kimchi.disabled=disabled}
function clearTimers(){clearTimeout(timer);clearTimeout(transitionTimer);timer=null;transitionTimer=null}
function updateScore(){el.score.textContent='라운드 '+gameState.round+' · 정답 '+gameState.correct;el.fails.textContent='실패 '+gameState.fails+'/'+MAX_FAIL;el.kg.textContent='먹인 밥 '+gameState.kg.toFixed(1)+' kg'}
function nextRound(){
 if(!gameState.playing)return;
 if(gameState.round>=MAX_ROUNDS){endGame(true);return}
 gameState.round++;
 gameState.target=Math.random()<.5?'water':'kimchi';
 gameState.roundActive=true;
 el.held.textContent=gameState.target==='water'?'💧':'🥬';
 el.held.classList.remove('hidden');
 el.hint.textContent=gameState.target==='water'?'물을 들었어요!':'김치를 들었어요!';
 updateScore();
 const limit=Math.max(650,1900-gameState.round*55);
 gameState.deadline=Date.now()+limit;
 clearTimeout(timer);
 timer=setTimeout(()=>miss('time'),limit);
 setButtons(false);
}
function startGame(){
 clearTimers();
 Object.assign(gameState,{playing:true,round:0,correct:0,fails:0,kg:0,target:'',deadline:0,roundActive:false});
 el.over.classList.add('hidden');el.held.classList.add('hidden');el.hint.textContent='준비…';updateScore();
 setButtons(true);
 transitionTimer=setTimeout(nextRound,700);
}
function answer(type){
 if(!gameState.playing||!gameState.roundActive)return;
 if(Date.now()>gameState.deadline){miss('time');return}
 clearTimeout(timer);timer=null;gameState.roundActive=false;setButtons(true);
 if(type!==gameState.target){miss('wrong');return}
 gameState.correct++;gameState.kg=gameState.correct*.1;
 el.kg.textContent='먹인 밥 '+gameState.kg.toFixed(1)+' kg';
 el.hint.textContent='정답! 🍚 춘구마 냠냠!';
 updateScore();pulse();
 transitionTimer=setTimeout(nextRound,350);
}
function miss(reason){
 if(!gameState.playing||!gameState.roundActive)return;
 clearTimeout(timer);timer=null;gameState.roundActive=false;setButtons(true);gameState.fails++;
 el.fails.textContent='실패 '+gameState.fails+'/'+MAX_FAIL;
 el.hint.textContent=reason==='time'?'시간 초과!':'아앗, 틀렸어요!';
 el.held.classList.add('hidden');
 el.chunguma.style.transform='rotate(-5deg)';
 setTimeout(()=>el.chunguma.style.transform='',180);
 if(gameState.fails>=MAX_FAIL){endGame(false);return}
 transitionTimer=setTimeout(nextRound,550);
}
function endGame(completed){
 clearTimers();gameState.playing=false;gameState.roundActive=false;setButtons(true);
 el.start.textContent='🍠 다시 도전하기';
 el.overText.textContent=completed?'20라운드 성공! 춘구마에게 '+gameState.kg.toFixed(1)+'kg을 먹였어요.':'춘구마에게 '+gameState.kg.toFixed(1)+'kg을 먹였어요. 실패 3회!';
 el.over.classList.remove('hidden');
}
function pulse(){
 el.chunguma.style.transform='scale(1.04)';
 setTimeout(()=>el.chunguma.style.transform='',160);
}
setButtons(true);
</script></body></html>
