<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6d365"><title>춘식이 다마고치 v0.5</title><style>:root{--ink:#28241f;--paper:#f8f2e7;--panel:#fff9ee;--green:#9fcf83;--green2:#76aa63;--red:#d9675f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e6dfd2;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}button,input{font:inherit}.game{width:min(470px,100%);background:var(--paper);border:5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 10px 0 #c4bbad}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;font-weight:900}.ver{font-size:11px;color:#81786d}.screen{margin:0 14px 12px;padding:12px;background:var(--green);border:5px solid var(--ink);border-radius:18px}.scene{height:310px;border:3px solid #4c5b3d;border-radius:12px;position:relative;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.sprite{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:250px;height:250px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;transition:.2s}.sleeping .sprite{width:300px;height:260px;top:46%}.idle-anim{animation:bob .9s steps(2,end) infinite alternate}@keyframes bob{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,calc(-50% - 3px))}}.bubble{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);background:#fff7e7;border:3px solid var(--ink);padding:7px 12px;border-radius:14px;font-weight:900;font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:2}.pixel-note{font-size:10px;color:#6e665d;text-align:center;margin-top:4px}.stats{display:grid;gap:7px;padding:12px 2px 2px}.stat{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:900}.bar{height:13px;background:#e6dcc9;border:2px solid var(--ink);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--green2);transition:.25s}.fill.danger{background:var(--red)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}.action{border:3px solid var(--ink);border-radius:13px;background:var(--panel);padding:10px 3px;cursor:pointer;font-weight:900;box-shadow:0 4px 0 #bdb3a3}.action:active{transform:translateY(3px);box-shadow:0 1px 0 #bdb3a3}.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink)}.bottom button{border:0;background:#eee4d3;padding:12px 4px;font-weight:900;cursor:pointer}.bottom button+button{border-left:2px solid var(--ink)}.panel{padding:10px 18px 18px}.panel h3{margin:4px 0 10px}.panel p{margin:7px 0}.hidden{display:none}.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:3px solid var(--ink);border-radius:12px;padding:9px;background:#fff9ee;min-height:74px}.card.locked{opacity:.6}.card b{display:block}.card span{font-size:11px;color:#685f54}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.tool{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff9ee;cursor:pointer;font-weight:800}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.note{font-size:12px;color:#6e665d;line-height:1.5}</style></head><body><div class="game"><div class="top"><div>🐱 춘식이 키우기 <span class="ver">v0.5</span></div><div id="day">DAY 1</div></div><div class="screen" id="homeScreen"><div class="scene" id="scene"><img id="bg" class="bg" src="assets/room.svg" alt="도트 방"><img id="sprite" class="sprite idle-anim" src="assets/idle.svg" alt="춘식이"><div class="bubble" id="message">안녕! 나를 키워줘!</div></div><div class="pixel-note">96×96 픽셀 스프라이트 · 도트 방 배경 · 흰색 입 부분 유지</div><div class="stats" id="stats"></div></div><div class="actions" id="actions"><button class="action" onclick="act('food')">🍚 먹이<small>배고픔↓ 행복↑</small></button><button class="action" onclick="act('exercise')">🏃 운동<small>건강↑ 피로↑</small></button><button class="action" onclick="act('play')">🎮 놀이<small>행복↑ 애정↑</small></button><button class="action" onclick="act('clean')">🧼 씻기<small>청결↑</small></button><button class="action" onclick="act('study')">📚 공부<small>지능↑</small></button><button class="action" onclick="act('sleep')">😴 잠<small>피로↓ 스트레스↓</small></button></div><section class="panel hidden" id="dexPanel"><h3>📖 춘식이 도감</h3><div class="dex" id="dex"></div></section><section class="panel hidden" id="savePanel"><h3>💾 세이브</h3><p class="note">게임 데이터는 이 브라우저의 localStorage에 저장됩니다. 다른 기기로 옮기려면 세이브 내보내기를 사용하세요.</p><div class="toolbar"><button class="tool" onclick="exportSave()">세이브 내보내기</button><button class="tool" onclick="document.getElementById('fileInput').click()">세이브 불러오기</button><button class="tool" onclick="resetGame()">처음부터</button><input id="fileInput" type="file" accept="application/json" hidden onchange="importSave(event)"></div></section><div class="bottom"><button onclick="showPanel('home')">🏠 홈</button><button onclick="showPanel('dex')">📖 도감</button><button onclick="showPanel('save')">💾 저장</button></div><div class="ver" style="text-align:center;padding:8px 0 10px">팬게임 프로토타입 · 비상업적 개인 제작용</div></div><div class="toast" id="toast"></div><script>
const KEY='choonsik-damagochi-v05',OLD1='choonsik-damagochi-v04',OLD2='choonsik-damagochi-v03';
const FRONT='assets/idle.svg',SLEEP='assets/sleep.svg',ROOM='assets/room.svg',NIGHT='assets/night.svg';
const BASE={day:1,last:Date.now(),actions:{food:0,exercise:0,play:0,clean:0,study:0,sleep:0},stats:{hunger:30,happiness:72,stress:18,fatigue:22,clean:82,health:60,affection:50,intelligence:20},evolution:'아기 춘식이',discovered:['아기 춘식이'],sleepingUntil:0};
const FORMS=[['baby','아기 춘식이','처음 만나는 기본 춘식이',()=>true,'🐱'],['foodie','먹보 춘식이','먹는 것을 특히 좋아하는 춘식이',(s,a)=>a.food>=14&&a.exercise<=6,'🍖'],['fitness','헬스 춘식이','운동과 건강 관리에 진심인 춘식이',(s,a)=>a.exercise>=10&&s.health>=72&&s.stress<=55,'💪'],['smart','똑똑 춘식이','공부와 퍼즐을 좋아하는 춘식이',(s,a)=>a.study>=10&&s.intelligence>=60&&s.stress<=65,'🧠'],['sleepy','잠꾸러기 춘식이','느긋하게 쉬는 것을 좋아하는 춘식이',(s,a)=>a.sleep>=12&&s.fatigue<=38,'😴'],['social','인싸 춘식이','플레이어와 노는 것을 좋아하는 춘식이',(s,a)=>a.play>=14&&s.affection>=72,'😎'],['clean','깔끔 춘식이','깨끗함과 자기관리를 중시하는 춘식이',(s,a)=>a.clean>=10&&s.clean>=90,'🧼'],['wild','야생 춘식이','운동과 놀이를 즐기는 활발한 춘식이',(s,a)=>a.exercise>=8&&a.play>=8&&s.health>=68&&s.fatigue<=60,'🌿'],['artist','예술가 춘식이','놀이와 여유 속에서 창의적인 성향을 보이는 춘식이',(s,a)=>a.play>=9&&s.happiness>=82&&s.stress<=35,'🎨'],['perfect','완벽 춘식이','건강·행복·청결·애정의 균형을 갖춘 희귀 춘식이',(s,a)=>s.health>=80&&s.happiness>=82&&s.clean>=88&&s.affection>=78&&s.stress<=30,'👑']];
function clone(o){return JSON.parse(JSON.stringify(o))}function clamp(v){return Math.max(0,Math.min(100,v))}function merge(r){const x=clone(BASE);if(!r||typeof r!=='object')return x;x.day=Number(r.day)||1;x.last=Number(r.last)||Date.now();x.actions={...x.actions,...(r.actions||{})};x.stats={...x.stats,...(r.stats||{})};x.evolution=r.evolution||x.evolution;x.discovered=Array.isArray(r.discovered)?r.discovered:x.discovered;x.sleepingUntil=Number(r.sleepingUntil)||0;return x}function load(){try{const r=localStorage.getItem(KEY)||localStorage.getItem(OLD1)||localStorage.getItem(OLD2);return r?merge(JSON.parse(r)):clone(BASE)}catch{return clone(BASE)}}
let state=load();applyOffline();save();render();
function applyOffline(){const h=Math.min(24,Math.max(0,(Date.now()-state.last)/3600000));if(h>.02){state.stats.hunger=clamp(state.stats.hunger+h*7);state.stats.fatigue=clamp(state.stats.fatigue+h*2.5);state.stats.stress=clamp(state.stats.stress+h*1.7);state.stats.clean=clamp(state.stats.clean-h*1.5)}}
function act(t){if(Date.now()<state.sleepingUntil&&t!=='sleep'){say('Zzz... 지금은 자고 있어요.');return}if(t==='sleep'){if(Date.now()<state.sleepingUntil){state.sleepingUntil=0;say('춘식이가 일어났어요!');render();return}else state.sleepingUntil=Date.now()+45000}const s=state.stats,a=state.actions;a[t]++;const e={food:{hunger:-24,happiness:6,affection:2},exercise:{health:6,stress:-5,fatigue:12,hunger:8},play:{happiness:9,affection:5,stress:-4,fatigue:5},clean:{clean:30,happiness:3,stress:-2},study:{intelligence:6,fatigue:8,stress:5},sleep:{fatigue:-32,stress:-10,health:3}}[t];Object.entries(e).forEach(([k,v])=>s[k]=clamp((s[k]||0)+v));checkEvolution();save();render();if(t!=='sleep')say({food:'냠냠! 맛있다!',exercise:'운동 완료!',play:'같이 노니까 좋아!',clean:'뽀송뽀송해졌어!',study:'공부 열심히 했어!'}[t])}
function checkEvolution(){const s=state.stats,a=state.actions;for(const id of ['perfect','fitness','smart','social','clean','wild','artist','foodie','sleepy','baby']){const f=FORMS.find(x=>x[0]===id);if(f[3](s,a)){if(f[1]!==state.evolution){state.evolution=f[1];if(!state.discovered.includes(f[1]))state.discovered.push(f[1]);say('✨ '+f[1]+'로 진화했어요!')}return}}}
function mood(){const s=state.stats;if(s.stress>75)return'많이 힘들어해요';if(s.hunger>75)return'배가 너무 고파요';if(s.fatigue>78)return'졸려요';if(s.clean<25)return'씻고 싶어요';if(s.happiness>85)return'기분이 최고예요!';return'오늘도 함께 놀자!'}
function render(){const s=state.stats,sleep=Date.now()<state.sleepingUntil;document.getElementById('day').textContent='DAY '+state.day;document.getElementById('message').textContent=sleep?'Zzz... 춘식이가 자고 있어요.':state.evolution+' · '+mood();document.getElementById('scene').classList.toggle('sleeping',sleep);const bg=document.getElementById('bg'),img=document.getElementById('sprite');bg.src=sleep?NIGHT:ROOM;img.src=sleep?SLEEP:FRONT;img.alt=sleep?'자는 춘식이':'춘식이';img.classList.toggle('idle-anim',!sleep);const rows=[['🍚 배고픔','hunger',s.hunger,true],['😊 행복','happiness',s.happiness,false],['😫 스트레스','stress',s.stress,true],['😴 피로','fatigue',s.fatigue,true],['🧼 청결','clean',s.clean,false]];document.getElementById('stats').innerHTML=rows.map(([n,k,v,b])=>`<div class="stat"><span>${n}</span><div class="bar"><div class="fill ${b&&v>72?'danger':''}" style="width:${v}%"></div></div><span>${Math.round(v)}</span></div>`).join('');renderDex()}
function renderDex(){document.getElementById('dex').innerHTML=FORMS.map(f=>{const ok=state.discovered.includes(f[1]);return `<div class="card ${ok?'':'locked'}"><b>${ok?f[4]:'❓'} ${ok?f[1]:'???'}</b><span>${ok?f[2]:'아직 발견하지 못했어요.'}</span></div>`}).join('')}
function showPanel(id){document.getElementById('homeScreen').classList.toggle('hidden',id!=='home');document.getElementById('actions').classList.toggle('hidden',id!=='home');document.getElementById('dexPanel').classList.toggle('hidden',id!=='dex');document.getElementById('savePanel').classList.toggle('hidden',id!=='save')}
function say(t){document.getElementById('message').textContent=t;const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
function save(){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}function exportSave(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='choonsik-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importSave(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=merge(JSON.parse(r.result));save();render();say('세이브를 불러왔어요!')}catch{say('세이브 파일을 읽지 못했어요.')}};r.readAsText(f);ev.target.value=''}function resetGame(){if(!confirm('처음부터 다시 시작할까요?'))return;state=clone(BASE);save();render();say('새로운 춘식이를 만났어요!')}
setInterval(()=>{if(Date.now()>=state.sleepingUntil)state.sleepingUntil=0;state.stats.hunger=clamp(state.stats.hunger+.35);state.stats.fatigue=clamp(state.stats.fatigue+.12);state.stats.clean=clamp(state.stats.clean-.10);if(state.stats.hunger>82)state.stats.happiness=clamp(state.stats.happiness-.12);if(state.stats.fatigue>85)state.stats.stress=clamp(state.stats.stress+.1);save();render()},30000);setInterval(render,1000);
</script></body></html>
