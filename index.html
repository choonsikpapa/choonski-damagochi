<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>춘식이 다마고치 v0.6</title><style>:root{--ink:#2a241e;--paper:#f8f1e4;--panel:#fffaf0;--green:#a6d485;--green2:#6fa65f;--red:#d9665f}*{box-sizing:border-box}body{margin:0;background:#e4ddd0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:14px}.game{width:min(470px,100%);background:var(--paper);border:5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 10px 0 #c7beaf}.top{display:flex;justify-content:space-between;align-items:center;padding:13px 17px 9px;font-weight:900}.ver{font-size:11px;color:#7d7468}.screen{margin:0 14px 12px;padding:11px;background:var(--green);border:5px solid var(--ink);border-radius:18px}.scene{height:310px;border:3px solid #4d5c3d;border-radius:12px;position:relative;overflow:hidden;background:url('assets/room_detailed.svg') center/cover;image-rendering:pixelated}.scene.sleeping{background-image:url('assets/night_detailed.svg')}.sprite{position:absolute;left:50%;top:46%;width:250px;height:250px;transform:translate(-50%,-50%);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));transition:.15s}.sleeping .sprite{width:292px;height:260px;top:48%;filter:none}.idle{animation:bob 1.1s steps(2,end) infinite alternate}@keyframes bob{to{transform:translate(-50%,-53%)}}.bubble{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#fff8e8;border:3px solid var(--ink);padding:7px 12px;border-radius:14px;font-weight:900;font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:3}.effect{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:24px;z-index:2;animation:pop .9s steps(3,end) 1;pointer-events:none}.small{font-size:18px}@keyframes pop{0%{opacity:0;transform:translate(-50%,8px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}.act-food{animation:food .7s steps(3,end)}.act-exercise{animation:exercise .8s steps(4,end)}.act-play{animation:sway .7s steps(4,end)}.act-clean{animation:shake .7s steps(4,end)}.act-study{animation:study .7s steps(3,end)}@keyframes food{35%{transform:translate(-50%,-46%) scale(1.04)}70%{transform:translate(-50%,-51%) scale(.98)}}@keyframes exercise{25%{transform:translate(-53%,-56%)}50%{transform:translate(-47%,-50%)}75%{transform:translate(-53%,-56%)}}@keyframes sway{50%{transform:translate(-50%,-50%) rotate(3deg)}}@keyframes shake{25%{transform:translate(-49%,-50%) rotate(-4deg)}50%{transform:translate(-51%,-50%) rotate(4deg)}}@keyframes study{40%{transform:translate(-50%,-54%)}}.stats{display:grid;gap:7px;padding:11px 2px 2px}.stat{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:900}.bar{height:13px;background:#e7ddca;border:2px solid var(--ink);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--green2)}.danger{background:var(--red)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}.action{border:3px solid var(--ink);border-radius:13px;background:var(--panel);padding:10px 3px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #bdb3a3}.action small{display:block;font-size:10px;margin-top:3px;color:#665d53}.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink)}.bottom button{border:0;background:#eee4d4;padding:12px 4px;font-weight:900}.bottom button+button{border-left:2px solid var(--ink)}.panel{padding:10px 18px 18px}.panel h3{margin:4px 0 10px}.hidden{display:none}.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:3px solid var(--ink);border-radius:12px;padding:9px;background:var(--panel);min-height:62px}.locked{opacity:.55}.card b{display:block}.card span{font-size:10px;color:#685f54}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.tool{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--panel);font-weight:800}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.show{opacity:1}.note{font-size:12px;color:#6e665d;line-height:1.45}.status{text-align:center;font-size:10px;color:#70675c;margin-top:4px}</style></head><body><div class="game"><div class="top"><div>🐱 춘식이 키우기 <span class="ver">v0.6</span></div><div id="day">DAY 1</div></div><div class="screen"><div class="scene" id="scene"><img id="sprite" class="sprite idle" src="assets/idle_detailed.svg" alt="춘식이"><div id="effect" class="effect hidden"></div><div id="message" class="bubble">안녕! 나를 키워줘!</div></div><div class="status">128px급 세밀한 픽셀아트 · 도트 방 · 행동 애니메이션</div><div id="stats" class="stats"></div></div><div class="actions"><button class="action" onclick="act('food')">🍚 먹이<small>배고픔↓ 행복↑</small></button><button class="action" onclick="act('exercise')">🏃 운동<small>건강↑ 피로↑</small></button><button class="action" onclick="act('play')">🎮 놀이<small>행복↑ 애정↑</small></button><button class="action" onclick="act('clean')">🧼 씻기<small>청결↑</small></button><button class="action" onclick="act('study')">📚 공부<small>지능↑</small></button><button class="action" onclick="act('sleep')">😴 잠<small>잠들기/깨기</small></button></div><section class="panel hidden" id="dexPanel"><h3>📖 춘식이 도감</h3><div id="dex" class="dex"></div></section><section class="panel hidden" id="savePanel"><h3>💾 세이브</h3><p class="note">현재 기기의 localStorage에 자동 저장됩니다.</p><div class="toolbar"><button class="tool" onclick="exportSave()">내보내기</button><button class="tool" onclick="document.getElementById('file').click()">불러오기</button><button class="tool" onclick="resetGame()">처음부터</button><input id="file" type="file" accept="application/json" hidden onchange="importSave(event)"></div></section><div class="bottom"><button onclick="show('home')">🏠 홈</button><button onclick="show('dex')">📖 도감</button><button onclick="show('save')">💾 저장</button></div><div class="ver" style="text-align:center;padding:8px 0 10px">팬게임 프로토타입 · v0.6</div></div><div id="toast" class="toast"></div><script>
const KEY='choonsik-damagochi-v06',OLD=['choonsik-damagochi-v05','choonsik-damagochi-v04','choonsik-damagochi-v03','choonsik-damagochi-v02'];
const FORMS=[['아기 춘식이',()=>true,'🐱'],['먹보 춘식이',(s,a)=>a.food>=14&&a.exercise<=6,'🍖'],['헬스 춘식이',(s,a)=>a.exercise>=10&&s.health>=72&&s.stress<=55,'💪'],['똑똑 춘식이',(s,a)=>a.study>=10&&s.intelligence>=60&&s.stress<=65,'🧠'],['잠꾸러기 춘식이',(s,a)=>a.sleep>=12&&s.fatigue<=38,'😴'],['인싸 춘식이',(s,a)=>a.play>=14&&s.affection>=72,'😎'],['깔끔 춘식이',(s,a)=>a.clean>=10&&s.clean>=90,'🧼'],['야생 춘식이',(s,a)=>a.exercise>=8&&a.play>=8&&s.health>=68&&s.fatigue<=60,'🌿'],['예술가 춘식이',(s,a)=>a.play>=9&&s.happiness>=82&&s.stress<=35,'🎨'],['완벽 춘식이',(s,a)=>s.health>=80&&s.happiness>=82&&s.clean>=88&&s.affection>=78&&s.stress<=30,'👑']];
const BASE={day:1,last:Date.now(),actions:{food:0,exercise:0,play:0,clean:0,study:0,sleep:0},stats:{hunger:30,happiness:72,stress:18,fatigue:22,clean:82,health:60,affection:50,intelligence:20},evolution:'아기 춘식이',discovered:['아기 춘식이'],sleepingUntil:0,actionUntil:0,actionType:''};
const EFFECT={food:'🍚',exercise:'✦ ✦',play:'🎮',clean:'✦ 💧 ✦',study:'📚'};
function clone(o){return JSON.parse(JSON.stringify(o))}function clamp(v){return Math.max(0,Math.min(100,v))}function load(){try{for(const k of [KEY,...OLD]){const r=localStorage.getItem(k);if(r)return merge(JSON.parse(r))}}catch{}return clone(BASE)}function merge(r){const x=clone(BASE);if(!r)return x;Object.assign(x,r);x.actions={...BASE.actions,...(r.actions||{})};x.stats={...BASE.stats,...(r.stats||{})};x.discovered=Array.isArray(r.discovered)?r.discovered:['아기 춘식이'];return x}
let state=load();applyOffline();save();render();
function applyOffline(){const h=Math.min(24,Math.max(0,(Date.now()-state.last)/3600000));if(h>.02){state.stats.hunger=clamp(state.stats.hunger+h*7);state.stats.fatigue=clamp(state.stats.fatigue+h*2.5);state.stats.stress=clamp(state.stats.stress+h*1.7);state.stats.clean=clamp(state.stats.clean-h*1.5)}}
function act(t){const now=Date.now();if(now<state.sleepingUntil&&t!=='sleep'){say('Zzz... 지금은 자고 있어요.');return}if(t==='sleep'){state.sleepingUntil=now<state.sleepingUntil?0:now+45000}else{state.actionUntil=now+1200;state.actionType=t}state.actions[t]++;const s=state.stats,e={food:{hunger:-24,happiness:6,affection:2},exercise:{health:6,stress:-5,fatigue:12,hunger:8},play:{happiness:9,affection:5,stress:-4,fatigue:5},clean:{clean:30,happiness:3,stress:-2},study:{intelligence:6,fatigue:8,stress:5},sleep:{fatigue:-32,stress:-10,health:3}}[t];Object.entries(e).forEach(([k,v])=>s[k]=clamp((s[k]||0)+v));checkEvolution();save();render();say(t==='sleep'?(state.sleepingUntil?'Zzz... 잘 자, 춘식이!':'춘식이가 일어났어요!'):( {'food':'냠냠! 맛있다!',exercise:'운동 완료!',play:'같이 노니까 좋아!',clean:'뽀송뽀송해졌어!',study:'공부 열심히 했어!'}[t]))}
function checkEvolution(){const s=state.stats,a=state.actions;for(const [n,f] of FORMS.slice().reverse())if(f(s,a)){state.evolution=n;if(!state.discovered.includes(n))state.discovered.push(n);return}}
function mood(){const s=state.stats;if(s.stress>75)return'많이 힘들어해요';if(s.hunger>75)return'배가 너무 고파요';if(s.fatigue>78)return'졸려요';if(s.clean<25)return'씻고 싶어요';if(s.happiness>85)return'기분이 최고예요!';return'오늘도 함께 놀자!'}
function render(){const now=Date.now(),sleep=now<state.sleepingUntil,scene=document.getElementById('scene'),img=document.getElementById('sprite'),ef=document.getElementById('effect');scene.classList.toggle('sleeping',sleep);img.src=sleep?'assets/sleep_detailed.svg':'assets/idle_detailed.svg';img.className='sprite '+(sleep?'':'idle');if(!sleep&&now<state.actionUntil){img.classList.add('act-'+state.actionType);ef.textContent=EFFECT[state.actionType]||'';ef.className='effect '+(state.actionType==='exercise'?'small':'')}else ef.className='effect hidden';document.getElementById('day').textContent='DAY '+state.day;document.getElementById('message').textContent=sleep?'Zzz... 춘식이가 자고 있어요.':state.evolution+' · '+mood();const s=state.stats,rows=[['🍚 배고픔','hunger',s.hunger,1],['😊 행복','happiness',s.happiness,0],['😫 스트레스','stress',s.stress,1],['😴 피로','fatigue',s.fatigue,1],['🧼 청결','clean',s.clean,0]];document.getElementById('stats').innerHTML=rows.map(([n,k,v,d])=>`<div class="stat"><span>${n}</span><div class="bar"><div class="fill ${d&&v>72?'danger':''}" style="width:${v}%"></div></div><span>${Math.round(v)}</span></div>`).join('');renderDex()}
function renderDex(){document.getElementById('dex').innerHTML=FORMS.map(([n,f,ico])=>{const ok=state.discovered.includes(n);return `<div class="card ${ok?'':'locked'}"><b>${ok?ico:'❓'} ${ok?n:'???'}</b><span>${ok?'발견 완료':'아직 발견하지 못했어요.'}</span></div>`}).join('')}
function show(id){document.querySelector('.screen').classList.toggle('hidden',id!=='home');document.querySelector('.actions').classList.toggle('hidden',id!=='home');document.getElementById('dexPanel').classList.toggle('hidden',id!=='dex');document.getElementById('savePanel').classList.toggle('hidden',id!=='save')}
function say(t){if(!t)return;document.getElementById('message').textContent=t;const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1200)}
function save(){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}function exportSave(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='choonsik-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importSave(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=merge(JSON.parse(r.result));save();render();say('세이브를 불러왔어요!')}catch{say('세이브 파일을 읽지 못했어요.')}};r.readAsText(f);ev.target.value=''}function resetGame(){if(!confirm('처음부터 다시 시작할까요?'))return;state=clone(BASE);save();render();say('새로운 춘식이를 만났어요!')}
setInterval(()=>{if(Date.now()>=state.sleepingUntil)state.sleepingUntil=0;if(Date.now()>=state.actionUntil)state.actionType='';state.stats.hunger=clamp(state.stats.hunger+.35);state.stats.fatigue=clamp(state.stats.fatigue+.12);state.stats.clean=clamp(state.stats.clean-.10);if(state.stats.hunger>82)state.stats.happiness=clamp(state.stats.happiness-.12);if(state.stats.fatigue>85)state.stats.stress=clamp(state.stats.stress+.1);save();render()},30000);setInterval(render,100);
</script></body></html>
