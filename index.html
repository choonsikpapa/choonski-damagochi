<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>춘식이 키우기 v0.8</title><style>:root{--ink:#211b17;--paper:#f7f0e4;--green:#a8d586;--panel:#fff9ee}*{box-sizing:border-box}body{margin:0;background:#ddd5c8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:10px}.game{width:min(470px,100%);background:var(--paper);border:5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #bdb3a5}.top{display:flex;justify-content:space-between;padding:14px 17px 9px;font-weight:900;font-size:18px}.ver{font-size:11px;color:#786e63}.screen{margin:0 14px 12px;padding:10px;background:var(--green);border:5px solid var(--ink);border-radius:18px}.scene{height:340px;border:3px solid #4d443b;border-radius:12px;overflow:hidden;position:relative;background:#f7ead4 url('assets/room.svg') center/cover no-repeat;image-rendering:pixelated}.scene.sleeping{background-image:url('assets/night.svg')}.sprite{position:absolute;left:50%;top:49%;width:270px;height:300px;transform:translate(-50%,-50%);object-fit:contain;image-rendering:pixelated;shape-rendering:crispEdges}.sleeping .sprite{width:330px;height:270px;top:54%}.idle{animation:bob 1s steps(2,end) infinite alternate}@keyframes bob{to{transform:translate(-50%,-53%)}}.fooding{animation:foodBounce .42s steps(2,end) infinite alternate}@keyframes foodBounce{to{transform:translate(-50%,-54%)}}.bubble{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff8e8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:900;z-index:3}.effect{position:absolute;left:50%;top:10%;font-size:24px;z-index:4;animation:pop .9s steps(3,end)}@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}.stats{display:grid;gap:7px;padding:11px 2px 2px}.stat{display:grid;grid-template-columns:78px 1fr 30px;gap:7px;align-items:center;font-size:13px;font-weight:900}.bar{height:13px;border:2px solid var(--ink);border-radius:10px;background:#e7ddca;overflow:hidden}.fill{height:100%;background:#6fa65f}.bad{background:#d9665f}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}.action{border:3px solid var(--ink);border-radius:14px;background:var(--panel);padding:10px 2px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #bdb3a5;font-size:16px}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #bdb3a5}.action small{display:block;font-size:10px;margin-top:3px;color:#665d53}.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink)}.bottom button{border:0;background:#eee4d4;padding:12px 3px;font-weight:900}.bottom button+button{border-left:2px solid var(--ink)}.panel{padding:12px 18px 18px}.hidden{display:none}.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:3px solid var(--ink);border-radius:12px;padding:9px;background:var(--panel)}.locked{opacity:.45}.card span{font-size:10px;color:#685f54}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.tool{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--panel);font-weight:800}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;z-index:10}.show{opacity:1}.status{text-align:center;font-size:10px;color:#70675c;margin-top:5px}@media(max-width:380px){.scene{height:300px}.sprite{width:235px;height:270px}.sleeping .sprite{width:290px;height:240px}.action{font-size:14px}}</style></head><body><main class="game"><div class="top"><div>🐱 춘식이 키우기 <span class="ver">v0.8</span></div><div id="day">DAY 1</div></div><div class="screen"><div class="scene" id="scene"><img id="sprite" class="sprite idle" src="assets/idle.svg" alt="춘식이"><div id="effect" class="effect hidden"></div><div id="message" class="bubble">아기 춘식이 · 오늘도 함께 놀자!</div></div><div class="status">128px급 세밀 픽셀아트 · 먹이 2프레임 애니메이션</div><div id="stats" class="stats"></div></div><div class="actions"><button class="action" onclick="act('food')">🍚 먹이<small>배고픔↓ 행복↑</small></button><button class="action" onclick="act('exercise')">🏃 운동<small>건강↑ 피로↑</small></button><button class="action" onclick="act('play')">🎮 놀이<small>행복↑ 애정↑</small></button><button class="action" onclick="act('clean')">🧼 씻기<small>청결↑</small></button><button class="action" onclick="act('study')">📚 공부<small>지능↑</small></button><button class="action" onclick="act('sleep')">😴 잠<small>잠들기/깨기</small></button></div><section id="dexPanel" class="panel hidden"><h3>📖 춘식이 도감</h3><div id="dex" class="dex"></div></section><section id="savePanel" class="panel hidden"><h3>💾 세이브</h3><p>현재 기기에 자동 저장됩니다.</p><div class="toolbar"><button class="tool" onclick="exportSave()">내보내기</button><button class="tool" onclick="file.click()">불러오기</button><button class="tool" onclick="resetGame()">처음부터</button><input id="file" type="file" accept="application/json" hidden></div></section><nav class="bottom"><button onclick="show('home')">🏠 홈</button><button onclick="show('dex')">📖 도감</button><button onclick="show('save')">💾 저장</button></nav><div class="ver" style="text-align:center;padding:8px">팬게임 프로토타입 · v0.8</div></main><div id="toast" class="toast"></div><script>const KEY='choonsik-damagochi-v08',OLD=['choonsik-damagochi-v07','choonsik-damagochi-v06','choonsik-damagochi-v05','choonsik-damagochi-v04'];const EAT_GIF='assets/eat_choonsik.gif';const FORMS=[['아기 춘식이',()=>true,'🐱'],['먹보 춘식이',(s,a)=>a.food>=14&&a.exercise<=6,'🍖'],['헬스 춘식이',(s,a)=>a.exercise>=10&&s.health>=72&&s.stress<=55,'💪'],['똑똑 춘식이',(s,a)=>a.study>=10&&s.intelligence>=60&&s.stress<=65,'🧠'],['잠꾸러기 춘식이',(s,a)=>a.sleep>=12&&s.fatigue<=38,'😴'],['인싸 춘식이',(s,a)=>a.play>=14&&s.affection>=72,'😎'],['깔끔 춘식이',(s,a)=>a.clean>=10&&s.clean>=90,'🧼'],['야생 춘식이',(s,a)=>a.exercise>=8&&a.play>=8&&s.health>=68&&s.fatigue<=60,'🌿'],['예술가 춘식이',(s,a)=>a.play>=9&&s.happiness>=82&&s.stress<=35,'🎨'],['완벽 춘식이',(s,a)=>s.health>=80&&s.happiness>=82&&s.clean>=88&&s.affection>=78&&s.stress<=30,'👑']];const BASE={day:1,last:Date.now(),actions:{food:0,exercise:0,play:0,clean:0,study:0,sleep:0},stats:{hunger:30,happiness:72,stress:18,fatigue:22,clean:82,health:60,affection:50,intelligence:20},evolution:'아기 춘식이',discovered:['아기 춘식이'],sleepingUntil:0,actionUntil:0,actionType:''};let state=load();offline();save();render();setInterval(()=>{if(Date.now()>state.sleepingUntil)decay();render()},30000);function cp(o){return JSON.parse(JSON.stringify(o))}function clamp(v){return Math.max(0,Math.min(100,v))}function load(){try{for(const k of [KEY,...OLD]){const r=localStorage.getItem(k);if(r)return merge(JSON.parse(r))}}catch(e){}return cp(BASE)}function merge(r){let x=cp(BASE);Object.assign(x,r||{});x.actions={...BASE.actions,...(r&&r.actions||{})};x.stats={...BASE.stats,...(r&&r.stats||{})};x.discovered=Array.isArray(r&&r.discovered)?r.discovered:['아기 춘식이'];return x}function offline(){let h=Math.min(24,Math.max(0,(Date.now()-state.last)/36e5));if(h>.02){state.stats.hunger=clamp(state.stats.hunger+h*7);state.stats.fatigue=clamp(state.stats.fatigue+h*2);state.stats.stress=clamp(state.stats.stress+h*1.5);state.stats.clean=clamp(state.stats.clean-h*1.2)}}function decay(){let s=state.stats;s.hunger=clamp(s.hunger+1.5);s.fatigue=clamp(s.fatigue+.6);s.stress=clamp(s.stress+.3);s.clean=clamp(s.clean-.3);save()}function act(t){let now=Date.now();if(now<state.sleepingUntil&&t!=='sleep'){say('Zzz... 지금은 자고 있어요.');return}if(t==='sleep'){state.sleepingUntil=now<state.sleepingUntil?0:now+45000;state.actionUntil=0;state.actionType=''}else{state.actionUntil=now+(t==='food'?1700:1100);state.actionType=t}state.actions[t]++;let s=state.stats,e={food:{hunger:-24,happiness:6,affection:2},exercise:{health:6,stress:-5,fatigue:12,hunger:8},play:{happiness:9,affection:5,stress:-4,fatigue:5},clean:{clean:30,happiness:3,stress:-2},study:{intelligence:6,fatigue:8,stress:5},sleep:{fatigue:-32,stress:-10,health:3}}[t];Object.entries(e).forEach(([k,v])=>s[k]=clamp((s[k]||0)+v));evolve();save();render();setTimeout(render,t==='food'?1750:1150);say(t==='sleep'?(state.sleepingUntil?'Zzz... 잘 자, 춘식이!':'춘식이가 일어났어요!'):{food:'냠냠! 맛있다!',exercise:'운동 완료!',play:'같이 노니까 좋아!',clean:'뽀송뽀송!',study:'공부 열심히 했어!'}[t])}function evolve(){let s=state.stats,a=state.actions;for(let i=FORMS.length-1;i>=0;i--)if(FORMS[i][1](s,a)){state.evolution=FORMS[i][0];if(!state.discovered.includes(state.evolution))state.discovered.push(state.evolution);break}}function render(){let now=Date.now(),sleep=now<state.sleepingUntil,foodAnim=!sleep&&state.actionType==='food'&&now<state.actionUntil;scene.classList.toggle('sleeping',sleep);if(sleep){sprite.src='assets/sleep.svg';sprite.className='sprite'}else if(foodAnim){sprite.src=EAT_GIF;sprite.className='sprite fooding'}else{sprite.src='assets/idle.svg';sprite.className='sprite idle'}if(!sleep&&now<state.actionUntil){effect.textContent=state.actionType==='food'?'🍚':'✦';effect.className='effect'}else effect.className='effect hidden';day.textContent='DAY '+state.day;message.textContent=sleep?'Zzz... 춘식이가 자고 있어요.':foodAnim?'냠냠! 밥을 먹고 있어요.':state.evolution+' · '+mood();let s=state.stats;stats.innerHTML=[['🍚 배고픔','hunger',s.hunger],['😊 행복','happiness',s.happiness],['😫 스트레스','stress',s.stress],['😴 피로','fatigue',s.fatigue],['🧼 청결','clean',s.clean]].map(x=>`<div class="stat"><span>${x[0]}</span><div class="bar"><div class="fill ${x[1]==='stress'&&x[2]>72?'bad':''}" style="width:${x[2]}%"></div></div><span>${Math.round(x[2])}</span></div>`).join('');renderDex()}function mood(){let s=state.stats;if(s.stress>75)return'많이 힘들어해요';if(s.hunger>75)return'배가 너무 고파요';if(s.fatigue>78)return'졸려요';if(s.clean<25)return'씻고 싶어요';if(s.happiness>85)return'기분이 최고예요!';return'오늘도 함께 놀자!'}function renderDex(){dex.innerHTML=FORMS.map(x=>{let ok=state.discovered.includes(x[0]);return`<div class="card ${ok?'':'locked'}"><b>${ok?x[2]:'❓'} ${ok?x[0]:'???'}</b><span>${ok?'발견 완료':'아직 발견하지 못했어요.'}</span></div>`}).join('')}function show(id){document.querySelector('.screen').classList.toggle('hidden',id!=='home');document.querySelector('.actions').classList.toggle('hidden',id!=='home');dexPanel.classList.toggle('hidden',id!=='dex');savePanel.classList.toggle('hidden',id!=='save')}function say(t){message.textContent=t;toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),1200)}function save(){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='choonsik-save.json';a.click();URL.revokeObjectURL(a.href)}file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state=merge(JSON.parse(r.result));save();render();say('세이브를 불러왔어요!')}catch{say('세이브 파일을 읽지 못했어요.')}};r.readAsText(f)};function resetGame(){if(confirm('처음부터 다시 시작할까요?')){state=cp(BASE);save();render();say('새로운 춘식이 키우기를 시작해요!')}}</script></body></html>
