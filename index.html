<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>춘식이 키우기 v1.6.1</title><style>:root{--ink:#211b17;--paper:#f7f0e4;--green:#a8d586;--panel:#fff9ee}*{box-sizing:border-box}body{margin:0;background:#ddd5c8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:10px}.game{width:min(470px,100%);background:var(--paper);border:5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #bdb3a5}.top{display:flex;justify-content:space-between;padding:14px 17px 9px;font-weight:900;font-size:18px}.ver{font-size:11px;color:#786e63}.screen{margin:0 14px 12px;padding:10px;background:var(--green);border:5px solid var(--ink);border-radius:18px}.scene{height:340px;border:3px solid #4d443b;border-radius:12px;overflow:hidden;position:relative;background:#f7ead4 url('assets/room.svg') center/cover no-repeat}.scene.sleeping{background-image:url('assets/night.svg')}.sprite,.foodFrames{position:absolute;left:50%;top:53%;width:150px;height:150px;transform:translate(-50%,-50%);image-rendering:pixelated}.sprite{object-fit:contain}.sleeping .sprite{width:180px;height:145px;top:56%}.foodFrames{z-index:2;pointer-events:none}.foodFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:none}.foodFrame.active{display:block}.foodBounce{animation:foodBounce .4s steps(2,end) infinite alternate}@keyframes foodBounce{to{transform:translate(-50%,-54%)}}.hidden{display:none!important}.idle{animation:bob 1s steps(2,end) infinite alternate}@keyframes bob{to{transform:translate(-50%,-53%)}}.bubble{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff8e8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:900;z-index:3}.effect{position:absolu er-events:none}.introFlash.on{animation:flash .8s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}.stats{display:grid;gap:7px;padding:11px 2px 2px}.stat{display:grid;grid-template-columns:78px 1fr 30px;gap:7px;align-items:center;font-size:13px;font-weight:900}.bar{height:13px;border:2px solid var(--ink);border-radius:10px;background:#e7ddca;overflow:hidden}.fill{height:100%;background:#6fa65f}.bad{background:#d9665f}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}.action,.itemBtn{border:3px solid var(--ink);border-radius:14px;background:var(--panel);padding:10px 2px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #bdb3a5;font-size:16px}.action:active,.itemBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #bdb3a5}.action small{display:block;font-size:10px;margin-top:3px;color:#665d53}.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink)}.bottom button{border:0;background:#eee4d4;padding:12px 3px;font-weight:900}.bottom button+button{border-left:2px solid var(--ink)}.panel{padding:12px 18px 18px}.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card,.itemCard{border:3px solid var(--ink);border-radius:12px;padding:9px;background:var(--panel)}.locked{opacity:.45}.card span,.itemDesc{display:block;font-size:10px;color:#685f54}.toolbar,.items{display:flex;gap:7px;flex-wrap:wrap}.tool,.itemBtn{font-size:13px;padding:8px 10px}.itemCard{width:calc(50% - 4px);display:flex;flex-direction:column;gap:5px}.itemHead{display:flex;justify-content:space-between;font-weight:1000}.itemQty{font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;z-index:10}.show{opacity:1}.status{text-align:center;font-size:10px;color:#70675c;margin-top:5px}.growth{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:7px;padding:8px 10px;background:#fff9ee;border:2px solid var(--ink);border-radius:10px;font-size:11px;font-weight:900}.growth b{font-size:12px}.growth small{font-size:10px;color:#70675c}.introLocked{opacity:.55;pointer-events:none;filter:grayscale(.2)}@media(max-width:380px){.scene{height:300px}.sprite,.foodFrames{width:130px;height:130px}.sleeping .sprite{width:160px;height:130px}.action{font-size:14px}.boxIntro{transform:translate(-50%,-50%) scale(.88)}.boxIntro.shake{transform:translate(-50%,-50%) scale(.88)}.itemCard{width:100%}}</style></head><body><main class="game"><div class="top"><div>🐱 춘식이 키우기 <span class="ver">v1.6.1</span></div><div id="day">DAY 1</div></div><div class="screen"><div class="scene" id="scene"><img id="sprite" class="sprite idle hidden" src="assets/idle.svg" alt="춘식이"><div id="boxIntro" class="boxIntro"><div class="boxBody"><div class="boxTape"></div><div class="boxLabel">📦</div><div class="boxMark">FRAGILE</div></div></div><div id="introTitle" class="introTitle">📦 수상한 종이상자</div><div id="introHint" class="introHint">상자 안에서 무언가 움직이고 있어요…</div><div id="introTimer" class="introTimer">춘식이를 만날 때까지 5:00</div><div id="introFlash" class="introFlash"></div><div id="foodFrames" class="foodFrames hidden"><img id="food1" class="foodFrame" src="assets/eat_choonsik_1.png?v=15" alt="먹기 1"><img id="food2" class="foodFrame" src="assets/eat_choonsik_2.png?v=15" alt="먹기 2"></div><div id="effect" class="effect hidden"></div><div id="message" class="bubble">상자 안에서 뭔가 움직이는 것 같다…</div></div><div class="status" id="status">상자 안에서 춘식이가 나오기를 기다리는 중</div><div id="growth" class="growth"></div><div id="stats" class="stats"></div></div><div class="actions" id="actions"><button class="action" onclick="act('food')">🍚 먹이<small>배고픔↓ 행복↑</small></button><button class="action" onclick="act('exercise')">🏃 운동<small>건강↑ 피로↑</small></button><button class="action" onclick="act('play')">🎮 놀이<small>행복↑ 애정↑</small></button><button class="action" onclick="act('clean')">🧼 씻기<small>청결↑</small></button><button class="action" onclick="act('study')">📚 공부<small>지능↑</small></button><button class="action" onclick="act('sleep')">😴 잠<small>잠들기/깨기</small></button></div><section id="itemPanel" class="panel hidden"><h3>🎒 음식 아이템</h3><p style="font-size:12px">특별한 음식은 수량을 사용합니다. 기본 🍚 먹이는 무제한이에요.</p><div id="items" class="items"></div></section><section id="dexPanel" class="panel hidden"><h3>📖 춘식이 도감</h3><div id="dex" class="dex"></div></section><section id="savePanel" class="panel hidden"><h3>💾 세이브</h3><p>현재 기기에 자동 저장됩니다.</p><div class="toolbar"><button class="tool" onclick="exportSave()">내보내기</button><button class="tool" onclick="document.getElementById('file').click()">불러오기</button><button class="tool" onclick="resetGame()">처음부터</button><input id="file" type="file" accept="application/json" hidden></div></section><nav class="bottom"><button onclick="show('home')">🏠 홈</button><button onclick="show('items')">🎒 아이템</button><button onclick="show('dex')">📖 도감</button></nav><div class="ver" style="text-align:center;padding:8px">팬게임 프로토타입 · v1.6.1</div></main><div id="toast" class="toast"></div><script>
const KEY='choonsik-damagochi-v16';
const OLD=['choonsik-damagochi-v151','choonsik-damagochi-v15','choonsik-damagochi-v14','choonsik-damagochi-v13','choonsik-damagochi-v12','choonsik-damagochi-v11','choonsik-damagochi-v10','choonsik-damagochi-v09','choonsik-damagochi-v08'];
const BOX_TIME=300;
const $=id=>document.getElementById(id);
const el={scene:$('scene'),sprite:$('sprite'),boxIntro:$('boxIntro'),introTitle:$('introTitle'),introHint:$('introHint'),introTimer:$('introTimer'),introFlash:$('introFlash'),foodFrames:$('foodFrames'),food1:$('food1'),food2:$('food2'),effect:$('effect'),message:$('message'),status:$('status'),growth:$('growth'),stats:$('stats'),actions:$('actions'),itemPanel:$('itemPanel'),items:$('items'),dexPanel:$('dexPanel'),dex:$('dex'),savePanel:$('savePanel'),file:$('file'),day:$('day'),toast:$('toast')};
const FORMS=[
 ['아기 춘식이',()=>true,'🐱'],
 ['먹보 춘식이',(s,a)=>a.food>=14&&a.exercise<=6,'🍖'],
 ['헬스 춘식이',(s,a)=>a.exercise>=10&&s.health>=72&&s.stress<=55,'💪'],
 ['똑똑 춘식이',(s,a)=>a.study>=10&&s.intelligence>=60&&s.stress<=65,'🧠'],
 ['잠꾸러기 춘식이',(s,a)=>a.sleep>=12&&s.fatigue<=38,'😴'],
 ['인싸 춘식이',(s,a)=>a.play>=14&&s.affection>=72,'😎'],
 ['깔끔 춘식이',(s,a)=>a.clean>=10&&s.clean>=90,'🧼'],
 ['야생 춘식이',(s,a)=>a.exercise>=8&&a.play>=8&&s.health>=68&&s.fatigue<=60,'🌿'],
 ['예술가 춘식이',(s,a)=>a.play>=9&&s.happiness>=82&&s.stress<=35,'🎨'],
 ['완벽 춘식이',(s,a)=>s.health>=80&&s.happiness>=82&&s.clean>=88&&s.affection>=78&&s.stress<=30,'👑']
];
const ITEMS={
 banana:{name:'🍌 바나나',desc:'달콤해서 행복해져요',qty:3,effects:{hunger:-18,happiness:10},say:'🍌 오! 달콤해!'},
 carrot:{name:'🥕 당근',desc:'건강에 좋은 채소',qty:2,effects:{hunger:-15,health:8},say:'🥕 건강해지는 맛!'},
 cake:{name:'🍰 케이크',desc:'행복을 크게 올려줘요',qty:1,effects:{hunger:-30,happiness:20,affection:2},say:'🍰 생일 아니어도 맛있어!'},
 fish:{name:'🐟 생선',desc:'든든하고 건강한 한 끼',qty:1,effects:{hunger:-28,health:5},say:'🐟 냠! 생선이다!'},
 snack:{name:'⭐ 간식',desc:'작지만 기분 좋은 간식',qty:0,effects:{hunger:-10,happiness:15},say:'⭐ 간식 최고!'}
};
const ACTION_EFFECTS={
 food:{hunger:-24,happiness:6,affection:2},
 exercise:{health:6,stress:-5,fatigue:12,hunger:8},
 play:{happiness:9,affection:5,stress:-4,fatigue:5},
 clean:{clean:30,happiness:3,stress:-2},
 study:{intelligence:6,fatigue:8,stress:5},
 sleep:{fatigue:-32,stress:-10,health:3}
};
const STATS=[
 ['🍚 배고픔','hunger'],['😊 행복','happiness'],['😫 스트레스','stress'],['😴 피로','fatigue'],['🧼 청결','clean']
];
const BASE={day:1,last:Date.now(),ageSeconds:0,growthStage:'아기',actions:{food:0,exercise:0,play:0,clean:0,study:0,sleep:0},stats:{hunger:30,happiness:72,stress:18,fatigue:22,clean:82,health:60,affection:50,intelligence:20},evolution:'아기 춘식이',discovered:['아기 춘식이'],sleepingUntil:0,actionUntil:0,actionType:'',boxStartedAt:Date.now(),boxDone:false,items:{banana:3,carrot:2,cake:1,fish:1,snack:0}};
let state=load(),foodTimer=null,foodFrame=0,boxShaking=false,toastTimer=null;
offline();
save();
render();

setInterval(()=>{if(!isBoxIntro()&&Date.now()>state.sleepingUntil)decay();render()},30000);
setInterval(renderBox,250);

function cp(o){return JSON.parse(JSON.stringify(o))}
function clamp(v){return Math.max(0,Math.min(100,v))}
function growthStage(sec){return sec<86400?{name:'아기',icon:'🐣',next:86400}:sec<259200?{name:'어린이',icon:'🌱',next:259200}:sec<604800?{name:'청소년',icon:'🌿',next:604800}:{name:'성체',icon:'🌳',next:null}}
function ageText(sec){const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return d+'일 '+h+'시간 '+m+'분'}
function advanceAge(){
 if(isBoxIntro())return;
 const now=Date.now(),delta=Math.max(0,(now-(state.last||now))/1000);
 state.ageSeconds=(Number(state.ageSeconds)||0)+delta;
 state.last=now;
 const g=growthStage(state.ageSeconds);
 if(state.growthStage!==g.name){state.growthStage=g.name;say(g.icon+' 성장! 이제 '+g.name+' 춘식이예요!')}
}
function isBoxIntro(){return !state.boxDone}
function boxElapsed(){return Math.max(0,(Date.now()-(state.boxStartedAt||Date.now()))/1000)}
function boxRemaining(){return Math.max(0,BOX_TIME-boxElapsed())}
function boxTimeText(sec){let m=Math.floor(sec/60),s=Math.ceil(sec%60);if(s>=60){m++;s=0}return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

function revealBaby(){
 if(state.boxDone)return;
 state.boxDone=true;state.boxStartedAt=0;state.ageSeconds=0;state.growthStage='아기';state.last=Date.now();state.evolution='아기 춘식이';state.discovered=['아기 춘식이'];
 save();
 boxShaking=false;el.boxIntro.classList.remove('shake');el.introFlash.classList.add('on');
 setTimeout(()=>el.introFlash.classList.remove('on'),800);
 say('🎉 상자가 열렸다! 아기 춘식이가 발견됐어요!');
 render();
}
function renderBox(){
 if(isBoxIntro()){
  const remain=boxRemaining(),elapsed=boxElapsed();
  if(remain<=0){revealBaby();return}
  const shaking=elapsed>=240;
  el.boxIntro.classList.toggle('shake',shaking);
  if(shaking&&!boxShaking){boxShaking=true;say('📦 상자가 점점 더 세게 흔들려요!')}
  el.introTimer.textContent='춘식이를 만날 때까지 '+boxTimeText(remain);
  el.introHint.textContent=elapsed>=240?'상자 안에서 큰 소리가 들려요! 곧 열릴 것 같아요!':elapsed>=180?'상자가 조금씩 더 자주 흔들려요…':elapsed>=60?'상자 안에서 뭔가 움직이고 있어요…':'상자 안에서 무언가 움직이고 있어요…';
  return;
 }
 el.boxIntro.classList.add('hidden');el.introTitle.classList.add('hidden');el.introHint.classList.add('hidden');el.introTimer.classList.add('hidden');
 el.status.textContent='아기 춘식이와 함께 생활을 시작했어요!';el.actions.classList.remove('introLocked');
}
function load(){
 try{for(const k of [KEY,...OLD]){const raw=localStorage.getItem(k);if(raw)return merge(JSON.parse(raw),k)}}catch(e){}
 return cp(BASE);
}
function merge(r,sourceKey){
 const x=cp(BASE),data=r||{};
 Object.assign(x,data);
 x.actions={...BASE.actions,...(data.actions||{})};
 x.stats={...BASE.stats,...(data.stats||{})};
 x.items={...BASE.items,...(data.items||{})};
 x.ageSeconds=Number.isFinite(Number(x.ageSeconds))?Number(x.ageSeconds):0;
 x.growthStage=growthStage(x.ageSeconds).name;
 x.day=Math.floor(x.ageSeconds/86400)+1;
 x.discovered=Array.isArray(data.discovered)?data.discovered:['아기 춘식이'];
 if(typeof x.boxDone!=='boolean')x.boxDone=sourceKey!==KEY||x.ageSeconds>0||Object.values(x.actions).some(v=>v>0);
 if(!x.boxDone&&!x.boxStartedAt)x.boxStartedAt=Date.now();
 if(x.boxDone&&x.boxStartedAt)x.boxStartedAt=0;
 return x;
}
function offline(){
 if(isBoxIntro())return;
 const h=Math.min(24,Math.max(0,(Date.now()-state.last)/36e5));
 if(h>.02){
  state.stats.hunger=clamp(state.stats.hunger+h*7);
  state.stats.fatigue=clamp(state.stats.fatigue+h*2);
  state.stats.stress=clamp(state.stats.stress+h*1.5);
  state.stats.clean=clamp(state.stats.clean-h*1.2);
 }
}
function decay(){
 if(isBoxIntro())return;
 const s=state.stats;
 s.hunger=clamp(s.hunger+1.5);s.fatigue=clamp(s.fatigue+.6);s.stress=clamp(s.stress+.3);s.clean=clamp(s.clean-.3);
 save();
}
function showFoodFrame(n){foodFrame=n;el.food1.classList.toggle('active',n===0);el.food2.classList.toggle('active',n===1)}
function startFood(){
 if(isBoxIntro())return;
 clearInterval(foodTimer);foodFrame=0;showFoodFrame(0);
 el.foodFrames.classList.remove('hidden');el.sprite.classList.add('hidden');el.foodFrames.classList.add('foodBounce');
 let shown=1;
 foodTimer=setInterval(()=>{if(shown>=4){stopFood();return}showFoodFrame(shown%2);shown++},400);
}
function stopFood(){clearInterval(foodTimer);foodTimer=null;el.foodFrames.classList.add('hidden');el.sprite.classList.remove('hidden');el.sprite.src='assets/idle.svg';el.sprite.className='sprite idle'}
function applyEffects(e){for(const k in e)elStats(k,e[k])}
function elStats(k,v){state.stats[k]=clamp((state.stats[k]||0)+v)}
function act(t){
 if(isBoxIntro()){say('📦 아직 상자 안에 있어요. 조금만 기다려주세요!');return}
 const now=Date.now();
 if(now<state.sleepingUntil&&t!=='sleep'){say('Zzz... 지금은 자고 있어요.');return}
 if(t==='sleep'){
  state.sleepingUntil=now<state.sleepingUntil?0:now+45000;state.actionUntil=0;state.actionType='';
  clearInterval(foodTimer);foodTimer=null;el.foodFrames.classList.add('hidden');el.sprite.classList.remove('hidden');
 }else{
  state.actionUntil=now+(t==='food'?1600:1100);state.actionType=t;
  if(t!=='food')clearInterval(foodTimer);
 }
 state.actions[t]++;
 applyEffects(ACTION_EFFECTS[t]);evolve();save();
 if(t==='food')startFood();render();setTimeout(render,t==='food'?1650:1150);
 say(t==='sleep'?(state.sleepingUntil?'Zzz... 잘 자, 춘식이!':'춘식이가 일어났어요!'):{food:'냠냠! 맛있다!',exercise:'운동 완료!',play:'같이 노니까 좋아!',clean:'뽀송뽀송!',study:'공부 열심히 했어!'}[t]);
}
function useItem(id){
 if(isBoxIntro()){say('📦 춘식이가 아직 상자 안에 있어요!');return}
 const item=ITEMS[id],q=Number(state.items[id]||0);
 if(!item||q<=0){say('아직 '+(item?item.name:'이 아이템')+'이 없어요.');return}
 if(Date.now()<state.sleepingUntil){say('Zzz... 지금은 자고 있어요.');return}
 state.items[id]=q-1;state.actionUntil=Date.now()+1600;state.actionType='food';applyEffects(item.effects);state.actions.food++;
 evolve();save();startFood();render();setTimeout(render,1650);say(item.say);
}
function evolve(){
 const s=state.stats,a=state.actions;
 for(let i=FORMS.length-1;i>=0;i--)if(FORMS[i][1](s,a)){
  state.evolution=FORMS[i][0];
  if(!state.discovered.includes(state.evolution))state.discovered.push(state.evolution);
  break;
 }
}
function render(){
 const now=Date.now();
 if(isBoxIntro()){
  el.scene.classList.remove('sleeping');el.sprite.classList.add('hidden');el.foodFrames.classList.add('hidden');el.effect.className='effect hidden';
  el.growth.innerHTML='<b>🐣 성장 준비 중</b><small>춘식이를 발견한 뒤 성장이 시작돼요.</small>';
  el.stats.innerHTML='';el.actions.classList.add('introLocked');renderBox();el.day.textContent='DAY 1';
  el.message.textContent=boxRemaining()<=60?'상자가 크게 흔들리고 있어요!':'상자 안에서 뭔가 움직이는 것 같다…';return;
 }
 const sleep=now<state.sleepingUntil,food=state.actionType==='food'&&now<state.actionUntil;
 el.scene.classList.toggle('sleeping',sleep);
 if(sleep){stopFood();el.sprite.className='sprite';el.sprite.src='assets/sleep.svg'}
 else if(food){el.foodFrames.classList.remove('hidden');el.sprite.classList.add('hidden')}
 else if(!foodTimer){el.foodFrames.classList.add('hidden');el.sprite.className='sprite idle';el.sprite.src='assets/idle.svg'}
 el.effect.textContent=state.actionType==='food'?'🍚':'✦';
 el.effect.className=(!sleep&&now<state.actionUntil)?'effect':'effect hidden';
 el.day.textContent='DAY '+state.day;
 el.message.textContent=sleep?'Zzz... 춘식이가 자고 있어요.':food?'냠냠! 맛있는 걸 먹고 있어요.':state.evolution+' · '+mood();
 const g=growthStage(state.ageSeconds),remain=g.next?Math.max(0,g.next-state.ageSeconds):0;
 el.growth.innerHTML='<b>'+g.icon+' 성장 단계 · '+g.name+'</b><small>나이 '+ageText(state.ageSeconds)+(g.next?' · 다음 성장까지 '+ageText(remain):' · 최종 성장')+'</small>';
 const s=state.stats;
 el.stats.innerHTML=STATS.map(([label,key])=>'<div class="stat"><span>'+label+'</span><div class="bar"><div class="fill '+(key==='stress'&&s[key]>72?'bad':'')+'" style="width:'+s[key]+'%"></div></div><span>'+Math.round(s[key])+'</span></div>').join('');
 renderItems();renderDex();
}
function mood(){
 const s=state.stats;
 return s.stress>75?'많이 힘들어해요':s.hunger>75?'배가 너무 고파요':s.fatigue>78?'졸려요':s.clean<25?'씻고 싶어요':s.happiness>85?'기분이 최고예요!':'오늘도 함께 놀자!';
}
function renderItems(){
 el.items.innerHTML=Object.entries(ITEMS).map(([id,it])=>{
  const q=Number(state.items[id]||0);
  const fx=Object.entries(it.effects).map(([k,v])=>({hunger:'배고픔',happiness:'행복',health:'건강',affection:'애정'}[k]||k)+(v>0?' +':' ')+v).join(' · ');
  return '<div class="itemCard"><div class="itemHead"><span>'+it.name+'</span><span class="itemQty">x'+q+'</span></div><div class="itemDesc">'+it.desc+'</div><div class="itemDesc">'+fx+'</div><button class="itemBtn" onclick="useItem(\''+id+'\')" '+(q<=0?'disabled':'')+'>먹이기</button></div>';
 }).join('');
}
function renderDex(){
 el.dex.innerHTML=FORMS.map(x=>{
  const ok=state.discovered.includes(x[0]);
  return '<div class="card '+(ok?'':'locked')+'"><b>'+(ok?x[2]:'❓')+' '+(ok?x[0]:'???')+'</b><span>'+(ok?'발견 완료':'아직 발견하지 못했어요.')+'</span></div>';
 }).join('');
}
function show(id){
 document.querySelector('.screen').classList.toggle('hidden',id!=='home');
 el.actions.classList.toggle('hidden',id!=='home');
 el.itemPanel.classList.toggle('hidden',id!=='items');
 el.dexPanel.classList.toggle('hidden',id!=='dex');
 el.savePanel.classList.toggle('hidden',id!=='save');
}
function say(t){
 el.message.textContent=t;el.toast.textContent=t;el.toast.classList.add('show');clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.toast.classList.remove('show'),1200);
}
function save(){
 if(isBoxIntro()){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state));return}
 advanceAge();state.day=Math.floor(state.ageSeconds/86400)+1;localStorage.setItem(KEY,JSON.stringify(state));
}
function exportSave(){
 const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='choonsik-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),0);
}
el.file.onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader;
 r.onload=()=>{
  try{state=merge(JSON.parse(r.result),KEY);save();render();say('세이브를 불러왔어요!')}
  catch{say('세이브 파일을 읽지 못했어요.')}
  e.target.value='';
 };
 r.readAsText(f);
};
function resetGame(){
 if(!confirm('처음부터 다시 시작할까요?'))return;
 state=cp(BASE);state.boxStartedAt=Date.now();state.boxDone=false;state.last=Date.now();save();render();say('📦 새로운 상자가 도착했어요! 5분 뒤 춘식이를 만날 수 있어요.');
}
</script></body></html>
